<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-ZAIN Dev Repo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 24px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .url-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 14px;
            color: #a0a0a0;
            word-break: break-all;
        }
        .warning {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            color: #ff6b6b;
            font-size: 14px;
        }
        .packages {
            margin-top: 30px;
            text-align: right;
        }
        .package-item {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .package-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }
        .package-ver {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }
        footer {
            margin-top: 40px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔧</div>
        <h1>A-ZAIN Dev Repo</h1>
        <span class="badge">قناة التطوير — خاص</span>

        <p>ريبو التطوير الداخلي — لا يُنشر للمستخدمين</p>

        <div class="url-box">
            https://aosaid3224-ops.github.io/repo-dev/
        </div>

        <div class="warning">
            ⚠️ هذا الريبو مخصص للتطوير فقط. الأدوات هنا قيد التطوير وقد لا تكون مستقرة.
        </div>

        <div class="packages">
            <h3 style="margin-bottom: 16px; color: #888;">📦 الحزم المتوفرة</h3>
            <div class="package-item">
                <div class="package-name">Spider</div>
                <div class="package-ver">v2.2.63 — أحدث إصدار تطويري</div>
            </div>
        </div>

        <footer>
            A-ZAIN Repo © 2026 — @Zainqkvd
        </footer>
    </div>
</body>
</html>
